name: tournament-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tournament
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament -d tournament"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the TLS certificates (before Elasticsearch starts) and the app's least-privilege
  # user (once it is up), then exits. Re-running is harmless.
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    user: "0"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-local-only}
      ES_APP_PASSWORD: ${ES_APP_PASSWORD:-app-local-only}
    volumes:
      - escerts:/usr/share/elasticsearch/config/certs
      - ./monitoring/elasticsearch/setup.sh:/setup.sh:ro
    command: ["bash", "/setup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/elasticsearch/elasticsearch.crt ]"]
      interval: 2s
      timeout: 3s
      retries: 60

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    depends_on:
      es-setup:
        condition: service_healthy
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic-local-only}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: certs/elasticsearch/elasticsearch.key
      xpack.security.transport.ssl.certificate: certs/elasticsearch/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
    volumes:
      - escerts:/usr/share/elasticsearch/config/certs:ro
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'"]
      interval: 5s
      timeout: 5s
      retries: 60

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tournament
      REDIS_HOST: redis
      # Signing key for player tokens (32+ bytes). Empty means a random key per start.
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      # Elasticsearch over HTTPS, as the least-privilege user, trusting only our CA.
      ELASTICSEARCH_URIS: https://elasticsearch:9200
      SPRING_ELASTICSEARCH_USERNAME: tournament_app
      SPRING_ELASTICSEARCH_PASSWORD: ${ES_APP_PASSWORD:-app-local-only}
      SPRING_ELASTICSEARCH_RESTCLIENT_SSL_BUNDLE: elasticsearch
      SPRING_SSL_BUNDLE_PEM_ELASTICSEARCH_TRUSTSTORE_CERTIFICATE: file:/certs/ca/ca.crt
      # Set TOURNAMENT_CLOSES_AT=24h to play or load test after 20:00 UTC.
      TOURNAMENT_CLOSES_AT: ${TOURNAMENT_CLOSES_AT:-20h}
    volumes:
      - escerts:/certs:ro
    ports:
      - "${APP_PORT:-8080}:8080"
      # Actuator (health, metrics) is on 8081. Published to this machine only; never publicly.
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      es-setup:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Local only: anyone can view, admin/admin can edit.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tournament-service.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  escerts:
