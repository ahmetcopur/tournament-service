name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers starts Postgres, Redis (cluster mode) and Elasticsearch
      # with the runner's Docker.
      - name: Run tests
        run: ./mvnw -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  stack:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Builds the app image and starts what the smoke test needs (not Prometheus/Grafana).
      - name: Start the stack
        run: docker compose up -d --build postgres redis es-setup elasticsearch app caddy

      # HTTPS with a verified certificate, 401/403 rules, actuator off the public port,
      # Elasticsearch TLS and least-privilege user, background indexing, localhost-only ports.
      - name: Smoke test
        run: scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop
        if: always()
        run: docker compose down -v
